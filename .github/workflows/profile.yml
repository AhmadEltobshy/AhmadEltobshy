name: Refresh profile artwork
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'assets/portrait.png'
      - 'assets/profile.json'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-artwork
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering dependencies
        run: python -m pip install Pillow==12.3.0 resvg-py==0.5.0
      - name: Build artwork from public GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_profile.py
      - name: Commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.svg' '*.png' assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile artwork'
            git pull --rebase origin main
            git push
          fi
